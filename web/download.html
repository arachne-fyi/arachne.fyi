<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Download Arachne.fyi</title>
<meta name="description" content="Download the Arachne.fyi mod for Fabric.">
</head>
<body>
<!-- Download page. src/download.ts fills it from /api/public/versions. Header and footer come from partials/. -->
<site-header page="download"></site-header>

<main id="main" class="dl">
  <div class="dl-intro">
    <h1 class="px h2">Download</h1>
    <p class="soft">Supports Minecraft 26.2 and newer. Needs Fabric Loader, Fabric API and Java 25. <a href="/help">How to install</a></p>
  </div>

  <section class="panel dl-pick" aria-label="Get the mod">
    <div class="dl-fields">
      <div class="dl-field">
        <label for="mc" class="px dl-label">Your Minecraft version</label>
        <div class="select"><select id="mc" class="px" disabled><option>Loading…</option></select></div>
      </div>
      <div class="dl-field dl-loader">
        <span class="px dl-label muted">Loader</span>
        <span class="px dl-fixed">Fabric</span>
      </div>
    </div>
    <div class="dl-rule" aria-hidden="true"></div>
    <div class="dl-best">
      <div class="dl-best-info">
        <span id="best-label" class="px muted">Latest release</span>
        <span id="best-name" class="px dl-best-name">…</span>
        <span id="best-meta" class="muted small"></span>
      </div>
      <a id="best-link" class="btn btn-main dl-best-btn" href="/download/latest" aria-disabled="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        Download .jar
      </a>
    </div>
  </section>

  <section class="dl-all" aria-labelledby="all-h">
    <div class="dl-all-head">
      <h2 id="all-h" class="px h3">All versions</h2>
      <div class="dl-filters">
        <div class="seg" role="group" aria-label="Channel">
          <button type="button" class="px" data-channel="All" aria-pressed="true">All</button>
          <button type="button" class="px" data-channel="Release" aria-pressed="false">Release</button>
          <button type="button" class="px" data-channel="Beta" aria-pressed="false">Beta</button>
          <button type="button" class="px" data-channel="Nightly" aria-pressed="false">Nightly</button>
        </div>
        <div class="select select-small">
          <label for="mc-filter" class="sr-only">Minecraft version</label>
          <select id="mc-filter" class="px"><option value="all">All Minecraft versions</option></select>
        </div>
      </div>
    </div>
    <div class="panel dl-list">
      <div class="dl-row dl-row-head" aria-hidden="true"><span>Version</span><span>Minecraft</span><span>Published</span><span></span></div>
      <div id="rows"><p class="dl-empty muted">Loading…</p></div>
    </div>
    <p class="muted small">Beta builds are close to release. Nightly builds come from the latest code and may break.</p>
  </section>
</main>

<site-footer></site-footer>
<script type="module" src="/src/download.ts"></script>
</body>
</html>
